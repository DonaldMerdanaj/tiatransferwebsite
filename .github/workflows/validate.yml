name: Validate website
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: website-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --experimental-strip-types --test tests/header-scroll.test.mjs
      - run: npm run typecheck
      - run: npm run build
